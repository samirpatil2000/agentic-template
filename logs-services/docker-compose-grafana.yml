version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '4000:3000'
    expose:
      - 4000
    env_file:
      - .env
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GF_SERVER_SERVE_FROM_SUB_PATH}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    networks:
      - log-network

networks:
  log-network:
    external: true

volumes:
  grafana_data:
